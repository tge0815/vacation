name: Build & Push Container

# Baut das Docker-Image und pusht es in die GitHub Container Registry (GHCR).
# Danach auf dem Server nur noch ziehen (siehe docker-compose.prod.yml / deploy.sh).

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch: {} # manuell im Actions-Tab auslösbar

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # -> ghcr.io/tge0815/vacation

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # zum Pushen ins GHCR (nutzt GITHUB_TOKEN, kein Secret nötig)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (für arm64-Build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & Labels bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
