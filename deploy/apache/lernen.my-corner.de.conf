# Apache vHost für den Ferien-Lerncoach hinter Apache (Reverse-Proxy).
# Domain: lernen.my-corner.de  →  Container auf 127.0.0.1:3001 (LEARN_PORT)
#
# Einmalig Module aktivieren:
#   sudo a2enmod proxy proxy_http headers ssl rewrite
#   sudo systemctl reload apache2
#
# Datei ablegen unter /etc/apache2/sites-available/lernen.my-corner.de.conf, dann:
#   sudo a2ensite lernen.my-corner.de
#   sudo systemctl reload apache2
#
# HTTPS-Zertifikat am einfachsten mit certbot:
#   sudo certbot --apache -d lernen.my-corner.de
# certbot ergänzt die SSL-Zeilen automatisch. Die Vorlage unten enthält sie
# bereits — nutze entweder certbot ODER die manuellen SSLCertificate*-Zeilen.

<VirtualHost *:80>
    ServerName lernen.my-corner.de
    # Alles auf HTTPS umleiten
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName lernen.my-corner.de

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/lernen.my-corner.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/lernen.my-corner.de/privkey.pem

    # Original-Host + HTTPS an die App durchreichen (wichtig für Redirects &
    # das Secure-Cookie mit LEARN_COOKIE_SECURE=1).
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Lange laufende Antworten (Eltern-Coach-Chat per SSE) nicht nach 60 s kappen.
    ProxyTimeout 300

    ProxyPass        / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog  ${APACHE_LOG_DIR}/lernen-error.log
    CustomLog ${APACHE_LOG_DIR}/lernen-access.log combined
</VirtualHost>
