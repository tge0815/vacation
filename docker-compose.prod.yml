# Server-Betrieb mit FERTIGEM Image aus der GitHub Container Registry.
# Kein lokaler Build — das Image kommt aus GitHub Actions.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Bequemer: ./deploy.sh
#
# Anderes Tag/Registry: LEARN_IMAGE in .env setzen, z.B.
#   LEARN_IMAGE=ghcr.io/tge0815/vacation:sha-abc1234
services:
  lernferien:
    image: "${LEARN_IMAGE:-ghcr.io/tge0815/vacation:latest}"
    container_name: lernferien
    restart: unless-stopped
    pull_policy: always
    ports:
      # Nur an localhost gebunden — erreichbar über den Reverse-Proxy (Apache),
      # nicht direkt von außen. Für direkten LAN-Zugriff: LEARN_BIND=0.0.0.0.
      - "${LEARN_BIND:-127.0.0.1}:${LEARN_PORT:-3001}:3000"
    environment:
      # === KI (Anthropic-API über API-Key) ===
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY muss in .env gesetzt sein}"
      LEARN_AGENT_DEFAULT_MODEL: "claude-haiku-4-5-20251001"
      LEARN_AGENT_REASONING_MODEL: "claude-sonnet-4-6"
      LEARN_DATA_DIR: "/data"

      # === Login / Mehr-Familien ===
      LEARN_INVITE_CODE: "${LEARN_INVITE_CODE:-bitte-aendern}"
      LEARN_SESSION_SECRET: "${LEARN_SESSION_SECRET:-bitte-aendern}"
      LEARN_DEFAULT_FAMILY_EMAIL: "${LEARN_DEFAULT_FAMILY_EMAIL:-eltern@local}"
      LEARN_DEFAULT_FAMILY_PASSWORD: "${LEARN_DEFAULT_FAMILY_PASSWORD:-lernen}"
      LEARN_COOKIE_SECURE: "${LEARN_COOKIE_SECURE:-0}"

    volumes:
      # SQLite-DB — persistiert!
      - lernferien-data:/data

    # Nur DIESER Container wird von Watchtower automatisch aktualisiert.
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ── Auto-Deploy: zieht neue Images automatisch nach dem GitHub-Build ──
  # Opt-in über das Profil "autodeploy":
  #   docker compose -f docker-compose.prod.yml --profile autodeploy up -d
  # Prüft alle 2 Minuten die Registry und ersetzt den lernferien-Container,
  # sobald ein neues ghcr.io/tge0815/vacation:latest gepusht wurde.
  watchtower:
    image: containrrr/watchtower
    container_name: lernferien-watchtower
    restart: unless-stopped
    profiles: ["autodeploy"]
    environment:
      WATCHTOWER_CLEANUP: "true" # alte Images nach dem Update aufräumen
      WATCHTOWER_LABEL_ENABLE: "true" # nur markierte Container (siehe label oben)
      WATCHTOWER_POLL_INTERVAL: "120" # alle 120 s prüfen
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      # Privates GHCR-Paket? Zugangsdaten hier setzen (in .env), sonst leer lassen
      # (öffentliches Paket braucht nichts):
      REPO_USER: "${GHCR_USER:-}"
      REPO_PASS: "${GHCR_TOKEN:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  lernferien-data:
