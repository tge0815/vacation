services:
  lernferien:
    build: .
    image: ferien-lerncoach:latest
    container_name: lernferien
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # === KI (Max-Plan via Claude Code Agent SDK) ===
      # Auth liegt im lernferien-claude-Volume (siehe setup.sh).
      # KEIN API-Key, KEINE Pay-per-Token-Kosten.
      # Standard = schnelles Haiku (Aufgaben generieren, einfach bewerten, Vorlesen).
      # Reasoning = Sonnet (Textaufgaben/Maßstab bewerten, Eltern-Coach "Gründlich").
      LEARN_AGENT_DEFAULT_MODEL: "claude-haiku-4-5-20251001"
      LEARN_AGENT_REASONING_MODEL: "claude-sonnet-4-6"
      LEARN_DATA_DIR: "/data"

      # === Login / Mehr-Familien (öffentlicher Server) ===
      # Einladungscode für die Selbst-Registrierung neuer Familien.
      # Nur wer diesen Code kennt, kann ein Konto anlegen. UNBEDINGT ändern!
      LEARN_INVITE_CODE: "${LEARN_INVITE_CODE:-bitte-aendern}"
      # Geheimer Schlüssel zum Signieren der Login-Sessions. setup.sh erzeugt
      # beim ersten Start automatisch einen zufälligen Wert in .env.
      LEARN_SESSION_SECRET: "${LEARN_SESSION_SECRET:-bitte-aendern}"
      # Login-Daten der Standard-Familie, in die bestehende Kinder wandern
      # (nur bei bereits vorhandenen Daten relevant).
      LEARN_DEFAULT_FAMILY_EMAIL: "${LEARN_DEFAULT_FAMILY_EMAIL:-eltern@local}"
      LEARN_DEFAULT_FAMILY_PASSWORD: "${LEARN_DEFAULT_FAMILY_PASSWORD:-lernen}"
      # Auf 1 setzen, wenn die App hinter HTTPS läuft (härtere Login-Cookies).
      # Standard 0, damit der Login auch über http:// im LAN funktioniert.
      LEARN_COOKIE_SECURE: "${LEARN_COOKIE_SECURE:-0}"

    volumes:
      # SQLite-DB — persistiert!
      - lernferien-data:/data

      # Claude Code Auth (Max-Plan): Container hat eigene .claude im Volume.
      # setup.sh kopiert Host-Credentials einmalig rein. Re-Run synct neu.
      - lernferien-claude:/home/nextjs/.claude

volumes:
  lernferien-data:
  lernferien-claude:
